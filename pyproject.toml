[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglotsubs-kodi"
version = "0.1.0"
description = "PolyglotSubs Kodi addon with Subtitlecat provider"
authors = [{name="Sebastian Vannistel"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32,<3",
    "urllib3>=1.26,<2",
    "charset-normalizer>=3,<4",
    "chardet>=5,<6",
    "beautifulsoup4>=4.12,<5",
    "num2words>=0.5,<0.6",
]

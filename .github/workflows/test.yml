name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install beautifulsoup4
      - name: Lint
        run: |
          flake8 --exit-zero
      - name: Test
        run: |
          pytest -q
      - name: Integration Tests
        run: |
          pytest --run-integration -q
      - name: Validate commit
        run: |
          python scripts/validate_commit.py
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
  subtitlecat_layout_watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build subtitlecat watcher
        run: mvn -f tools/subtitlecat-layout-watch/pom.xml -DskipTests package
      - name: Run subtitlecat layout watch
        run: python tools/subtitlecat-layout-watch/watch_subtitlecat.py
